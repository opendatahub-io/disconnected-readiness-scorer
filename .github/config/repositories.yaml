# DRS PR automation. Only repositories listed here will have
# disconnected readiness workflows created or updated.
#
# Empty list = no repos processed (safe default for phased rollout).
# Add repos as they are onboarded.
#
# Format:
#   included_repositories:
#     - org/repo-name
#

